version: "3.7"

services:
  app_proxy:
    environment:
      # This routes the Umbrel dashboard click to the server
      APP_HOST: bonsai-server
      APP_PORT: 8080

  bonsai-server:
    build: .
    restart: on-failure
    volumes:
      # Maps an Umbrel persistent storage directory into the container's model folder
      - ${APP_DATA_DIR}/data:/app/models
    ports:
      # Exposes the server to your local network
      - "8080:8080"
